<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
<title>Créateur de visites</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    color: #171717;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

/* =========================================================
   APPLICATION
========================================================= */

.app {
    width: 100%;
    height: 100%;
    display: flex;
    background: #f5f5f5;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 300px;
    height: 100%;
    background: #ffffff;
    border-right: 1px solid #e4e4e4;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 20;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo span {
    color: #1683e8;
}

.new-project {
    width: 100%;
    height: 48px;
    border-radius: 13px;
    background: #1683e8;
    color: white;
    font-weight: 700;
}

.new-project:active {
    transform: scale(.98);
}

.sidebar-title {
    font-size: 13px;
    color: #888;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.scene-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.scene-empty {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
}

.scene-item {
    border: 1px solid #e2e2e2;
    border-radius: 13px;
    overflow: hidden;
    background: white;
}

.scene-thumb {
    width: 100%;
    height: 90px;
    object-fit: cover;
    background: #000;
}

.scene-info {
    padding: 9px;
}

.scene-name {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
}

.scene-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
}

.scene-buttons button {
    height: 30px;
    border-radius: 8px;
    background: #f1f1f1;
    color: #1683e8;
    font-size: 11px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    flex-shrink: 0;
}

.project-title {
    font-size: 18px;
    font-weight: 800;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.top-actions button {
    background: #f1f1f1;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 13px;
    font-weight: 600;
}

/* =========================================================
   MODE TABS
========================================================= */

.tabs {
    height: 58px;
    background: white;
    display: flex;
    border-bottom: 1px solid #e5e5e5;
    flex-shrink: 0;
}

.tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #777;
    position: relative;
}

.tab.active {
    color: #171717;
}

.tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 15%;
    width: 70%;
    height: 3px;
    border-radius: 10px;
    background: #1683e8;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #eeeeee;
}

/* =========================================================
   360 VIEWER
========================================================= */

.viewer360 {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
    overflow: hidden;
}

.panorama-view {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
}

.panorama-image {
    width: 100%;
    height: auto;
    max-height: 100%;
    object-fit: contain;
    display: block;
}

.empty-panorama {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 14px;
}

/* =========================================================
   VIEWER BUTTONS
========================================================= */

.viewer-button {
    position: absolute;
    top: 18px;
    z-index: 10;
    background: rgba(255,255,255,.94);
    color: #1683e8;
    border-radius: 12px;
    padding: 10px 15px;
    font-weight: 700;
    font-size: 14px;
}

.viewer-button.left {
    left: 18px;
}

.viewer-button.right {
    right: 18px;
}

/* =========================================================
   2D
========================================================= */

.viewer2d {
    width: 100%;
    height: 100%;
    background: #eee;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.viewer2d.show {
    display: flex;
}

.image2d {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
}

.empty2d {
    text-align: center;
    color: #777;
}

.import2d {
    margin-top: 15px;
    background: #1683e8;
    color: white;
    border-radius: 10px;
    padding: 11px 18px;
    font-weight: 700;
}

/* =========================================================
   CAPTURE OVERLAY
========================================================= */

.capture-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    display: none;
    color: white;
}

.capture-overlay.active {
    display: block;
}

/*
    La caméra existe techniquement comme flux interne,
    mais elle n'est JAMAIS affichée à l'utilisateur.
*/
#cameraVideo {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    left: -10px;
    top: -10px;
}

#captureCanvas {
    display: none;
}

/* =========================================================
   CAPTURE HEADER
========================================================= */

.capture-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 24px 24px 10px;
    z-index: 10;
}

.capture-title {
    font-size: 22px;
    font-weight: 800;
}

.capture-position {
    margin-top: 5px;
    color: #888;
    font-size: 14px;
}

/* =========================================================
   CLOSE
========================================================= */

.close-capture {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.25);
    color: white;
    font-size: 25px;
    z-index: 20;
}

/* =========================================================
   PANORAMA CONSTRUCTION AREA
========================================================= */

.capture-panorama-container {
    position: absolute;
    left: 5%;
    right: 5%;
    top: 145px;
    height: 42vh;
    min-height: 230px;
    max-height: 500px;
    border: 1px solid #2d2d2d;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
}

#progressivePanorama {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.panorama-black {
    position: absolute;
    inset: 0;
    background: #000;
}

/* =========================================================
   DIRECTION INDICATOR
========================================================= */

.direction-zone {
    position: absolute;
    left: 50%;
    top: calc(145px + 42vh + 35px);
    transform: translateX(-50%);
    width: min(330px, 70vw);
    height: 170px;
}

.direction-circle {
    position: absolute;
    width: 165px;
    height: 165px;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    border: 2px solid #383838;
    border-radius: 50%;
}

.direction-circle::before,
.direction-circle::after {
    content: "";
    position: absolute;
    background: #242424;
}

.direction-circle::before {
    width: 100%;
    height: 1px;
    top: 50%;
    left: 0;
}

.direction-circle::after {
    height: 100%;
    width: 1px;
    left: 50%;
    top: 0;
}

.center-point {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid white;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.target-point {
    position: absolute;
    width: 42px;
    height: 42px;
    border: 3px solid #ff9d00;
    border-radius: 50%;
    left: 75%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.target-point::before,
.target-point::after {
    content: "";
    position: absolute;
    background: #ff9d00;
}

.target-point::before {
    width: 80px;
    height: 3px;
    top: 17px;
    left: -22px;
}

.target-point::after {
    width: 3px;
    height: 80px;
    left: 17px;
    top: -22px;
}

.instruction {
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    white-space: nowrap;
    border: 1px solid #444;
    border-radius: 30px;
    padding: 10px 18px;
    font-size: 14px;
    color: #ddd;
}

/* =========================================================
   CAPTURE BOTTOM
========================================================= */

.capture-bottom {
    position: absolute;
    left: 38px;
    right: 38px;
    bottom: 75px;
    z-index: 10;
}

.progress-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
}

.progress-track {
    width: 100%;
    height: 5px;
    border-radius: 10px;
    background: #333;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: white;
    border-radius: 10px;
    transition: width .25s ease;
}

.capture-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 25px;
}

.cancel-photo {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #222;
    border: 1px solid #444;
    color: #aaa;
    font-size: 24px;
}

.take-photo {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: white;
    border: 5px solid #777;
    box-shadow: 0 0 0 4px #222;
}

.take-photo:active {
    transform: scale(.94);
}

.take-photo:disabled {
    opacity: .4;
}

/* =========================================================
   PHOTO CONFIRMATION
========================================================= */

.photo-confirm {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.93);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.photo-confirm.active {
    display: flex;
}

.confirm-card {
    width: min(620px, 100%);
    text-align: center;
}

.confirm-image {
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
    border-radius: 14px;
    background: #111;
}

.confirm-title {
    font-size: 21px;
    font-weight: 800;
    margin-top: 18px;
}

.confirm-subtitle {
    color: #999;
    margin-top: 7px;
}

.confirm-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 22px;
}

.confirm-buttons button {
    min-width: 145px;
    height: 48px;
    border-radius: 12px;
    font-weight: 700;
}

.retake {
    background: #252525;
    color: white;
}

.accept {
    background: #1683e8;
    color: white;
}

/* =========================================================
   PROCESSING
========================================================= */

.processing {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.94);
    color: white;
    text-align: center;
}

.processing.active {
    display: flex;
}

.spinner {
    width: 45px;
    height: 45px;
    border: 4px solid #333;
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-menu {
    display: none;
}

@media (max-width: 800px) {

    .sidebar {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: auto;
        max-height: 75vh;
        border-right: 0;
        border-top: 1px solid #ddd;
        padding: 14px;
        transform: translateY(100%);
        transition: transform .25s ease;
        box-shadow: 0 -10px 30px rgba(0,0,0,.12);
    }

    .sidebar.open {
        transform: translateY(0);
    }

    .sidebar .logo,
    .sidebar .sidebar-title {
        display: none;
    }

    .scene-list {
        max-height: 250px;
    }

    .mobile-menu {
        display: flex;
        position: fixed;
        z-index: 40;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        height: 48px;
        border-radius: 25px;
        padding: 0 20px;
        align-items: center;
        justify-content: center;
        background: #171717;
        color: white;
        font-weight: 700;
    }

    .topbar {
        height: 58px;
        padding: 0 12px;
    }

    .project-title {
        font-size: 15px;
    }

    .top-actions button {
        padding: 8px;
        font-size: 11px;
    }

    .viewer-button {
        top: 12px;
        padding: 9px 12px;
        font-size: 12px;
    }

    .viewer-button.left {
        left: 10px;
    }

    .viewer-button.right {
        right: 10px;
    }

    .capture-header {
        padding: 24px 20px 10px;
    }

    .capture-title {
        font-size: 19px;
    }

    .capture-panorama-container {
        top: 125px;
        left: 3%;
        right: 3%;
        height: 34vh;
    }

    .direction-zone {
        top: calc(125px + 34vh + 20px);
        transform: translateX(-50%) scale(.82);
    }

    .capture-bottom {
        left: 20px;
        right: 20px;
        bottom: 24px;
    }

    .capture-controls {
        margin-top: 15px;
    }

    .take-photo {
        width: 76px;
        height: 76px;
    }

    .cancel-photo {
        width: 55px;
        height: 55px;
    }

    .confirm-image {
        max-height: 48vh;
    }

    .confirm-buttons {
        flex-direction: column;
    }

    .confirm-buttons button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            Tour<span>360</span>
        </div>

        <button class="new-project" id="newProjectButton">
            + Nouvelle scène
        </button>

        <div class="sidebar-title">
            Mes scènes
        </div>

        <div class="scene-list" id="sceneList">
            <div class="scene-empty">
                Aucune scène pour le moment.
                Crée ton premier panorama.
            </div>
        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <header class="topbar">

            <div class="project-title" id="projectTitle">
                Créateur de visite
            </div>

            <div class="top-actions">

                <button id="fullscreenButton">
                    ⛶ Plein écran
                </button>

                <button id="resetButton">
                    ↻ Réinitialiser
                </button>

            </div>

        </header>


        <!-- =================================================
             TABS
        ================================================== -->

        <div class="tabs">

            <button class="tab active" id="tab360">
                360°
            </button>

            <button class="tab" id="tab2d">
                2D
            </button>

        </div>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <section class="workspace">

            <!-- 360 -->

            <div class="viewer360" id="viewer360">

                <button class="viewer-button left" id="openSceneButton">
                    ↻ Scènes
                </button>

                <button class="viewer-button right" id="fullscreenViewer">
                    ⛶ Plein écran
                </button>

                <div class="panorama-view">

                    <div class="empty-panorama" id="emptyPanorama">
                        Crée une scène 360°
                    </div>

                    <img
                        id="panoramaImage"
                        class="panorama-image"
                        alt="Panorama"
                        style="display:none;"
                    >

                </div>

            </div>


            <!-- 2D -->

            <div class="viewer2d" id="viewer2d">

                <div class="empty2d" id="empty2d">

                    <div>
                        Aucune image 2D
                    </div>

                    <button
                        class="import2d"
                        id="import2dButton"
                    >
                        Importer une image
                    </button>

                </div>

                <img
                    id="image2d"
                    class="image2d"
                    style="display:none;"
                    alt="Image 2D"
                >

            </div>

        </section>

    </main>

</div>


<button class="mobile-menu" id="mobileMenu">
    ☰ Mes scènes
</button>


<!-- =========================================================
     INPUTS
========================================================== -->

<input
    type="file"
    id="input2d"
    accept="image/*"
    hidden
>


<!-- =========================================================
     CAMERA CAPTURE
========================================================== -->

<div class="capture-overlay" id="captureOverlay">

    <!-- Flux caméra interne.
         Il n'est PAS affiché. -->

    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted
    ></video>

    <canvas id="captureCanvas"></canvas>


    <div class="capture-header">

        <div class="capture-title">
            Création du panorama
        </div>

        <div
            class="capture-position"
            id="capturePosition"
        >
            Position : Avant
        </div>

    </div>


    <button
        class="close-capture"
        id="closeCapture"
    >
        ×
    </button>


    <!-- =====================================================
         PANORAMA QUI SE CONSTRUIT
    ====================================================== -->

    <div class="capture-panorama-container">

        <canvas
            id="progressivePanorama"
            width="2400"
            height="800"
        ></canvas>

        <div
            class="panorama-black"
            id="panoramaBlack"
        ></div>

    </div>


    <!-- =====================================================
         DIRECTION
    ====================================================== -->

    <div class="direction-zone">

        <div class="direction-circle">

            <div class="center-point"></div>

            <div
                class="target-point"
                id="targetPoint"
            ></div>

        </div>

        <div
            class="instruction"
            id="captureInstruction"
        >
            Prends la photo
        </div>

    </div>


    <!-- =====================================================
         BOTTOM
    ====================================================== -->

    <div class="capture-bottom">

        <div class="progress-row">

            <span id="photoCounter">
                Photo 1 / 12
            </span>

            <span id="photoPercent">
                0%
            </span>

        </div>

        <div class="progress-track">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>

        <div class="capture-controls">

            <button
                class="cancel-photo"
                id="cancelCapture"
            >
                ×
            </button>

            <button
                class="take-photo"
                id="takePhotoButton"
                aria-label="Prendre une photo"
            >
            </button>

        </div>

    </div>


    <!-- =====================================================
         CONFIRMATION
    ====================================================== -->

    <div
        class="photo-confirm"
        id="photoConfirm"
    >

        <div class="confirm-card">

            <img
                id="confirmImage"
                class="confirm-image"
                alt="Photo capturée"
            >

            <div class="confirm-title">
                Photo capturée
            </div>

            <div class="confirm-subtitle" id="confirmSubtitle">
                Vérifie l'image avant de continuer.
            </div>

            <div class="confirm-buttons">

                <button
                    class="retake"
                    id="retakeButton"
                >
                    ↻ Reprendre
                </button>

                <button
                    class="accept"
                    id="acceptButton"
                >
                    Parfait →
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     PROCESSING
========================================================== -->

<div
    class="processing"
    id="processing"
>

    <div>

        <div class="spinner"></div>

        <div>
            Assemblage du panorama...
        </div>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const TOTAL_PHOTOS = 12;

/*
    12 photos = 360°
    360 / 12 = 30°
*/
const STEP_ANGLE = 30;

/*
    Partie de la photo utilisée dans le panorama.

    On ne met volontairement PAS toute la photo.
    On utilise une zone centrale afin d'éviter les
    répétitions importantes entre deux photos.
*/
const SOURCE_START = 0.25;
const SOURCE_END = 0.75;


/* =========================================================
   ELEMENTS
========================================================= */

const sidebar = document.getElementById("sidebar");
const mobileMenu = document.getElementById("mobileMenu");

const newProjectButton =
    document.getElementById("newProjectButton");

const sceneList =
    document.getElementById("sceneList");

const projectTitle =
    document.getElementById("projectTitle");

const viewer360 =
    document.getElementById("viewer360");

const viewer2d =
    document.getElementById("viewer2d");

const tab360 =
    document.getElementById("tab360");

const tab2d =
    document.getElementById("tab2d");

const panoramaImage =
    document.getElementById("panoramaImage");

const emptyPanorama =
    document.getElementById("emptyPanorama");

const import2dButton =
    document.getElementById("import2dButton");

const input2d =
    document.getElementById("input2d");

const image2d =
    document.getElementById("image2d");

const empty2d =
    document.getElementById("empty2d");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const fullscreenViewer =
    document.getElementById("fullscreenViewer");

const resetButton =
    document.getElementById("resetButton");

const openSceneButton =
    document.getElementById("openSceneButton");


/* CAMERA */

const captureOverlay =
    document.getElementById("captureOverlay");

const cameraVideo =
    document.getElementById("cameraVideo");

const captureCanvas =
    document.getElementById("captureCanvas");

const progressivePanorama =

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "La caméra n'est pas disponible dans ce navigateur."
        );

    }

    cameraStream =
        await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 4032
                },

                height: {
                    ideal: 3024
                }
            },

            audio: false

        });


    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();


    /*
        ImageCapture est utilisé en priorité.

        Cela permet de prendre une vraie photo
        à partir du flux caméra sans afficher une
        interface vidéo à l'utilisateur.
    */

    if (
        typeof ImageCapture !== "undefined"
    ) {

        const track =
            cameraStream.getVideoTracks()[0];

        try {

            imageCapture =
                new ImageCapture(track);

        } catch (error) {

            imageCapture = null;

            console.warn(
                "ImageCapture indisponible.",
                error
            );
        }

    } else {

        imageCapture = null;

    }

}


/* =========================================================
   ARRET CAMERA
========================================================= */

function stopCamera() {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(track => track.stop());

    }

    cameraStream = null;
    imageCapture = null;

    cameraVideo.srcObject = null;
}

    }

}

/* =========================================================
   CAPTURE PHOTO
========================================================= */

async function capturePhoto() {

    /*
        PRIORITE 1 :
        ImageCapture.takePhoto()
    */

    if (imageCapture) {

        try {

            const blob =
                await imageCapture.takePhoto();

            return blob;

        } catch (error) {

            console.warn(
                "ImageCapture.takePhoto() a échoué.",
                error
            );

        }

    }


    /*
        FALLBACK :

        On utilise le flux caméra interne,
        puis on capture UNE image avec Canvas.

        Aucun élément vidéo n'est visible.
    */

    if (
        cameraVideo.readyState >= 2 &&
        cameraVideo.videoWidth > 0 &&
        cameraVideo.videoHeight > 0
    ) {

        const width =
            cameraVideo.videoWidth;

        const height =
            cameraVideo.videoHeight;


        captureCanvas.width =
            width;

        captureCanvas.height =
            height;


        const ctx =
            captureCanvas.getContext("2d");


        ctx.drawImage(
            cameraVideo,
            0,
            0,
            width,
            height
        );


        return await new Promise(
            resolve => {

                captureCanvas.toBlob(
                    blob => resolve(blob),
                    "image/jpeg",
                    .92
                );

            }
        );

    }


    throw new Error(
        "La caméra n'est pas prête."
    );

}

function clearProgressivePanorama() {

        0,
        progressivePanorama.width,
        progressivePanorama.height
    );

/* =========================================================
   AJOUT PHOTO AU PANORAMA
========================================================= */

async function addPhotoToPanorama(
    blob,
    photoIndex
) {

    const image =
        await blobToImage(blob);


    /*
        Dimensions du panorama.

        2400 x 800 donne une image equirectangulaire
        simple à afficher et assez légère.
    */

    const panoWidth =
        progressivePanorama.width;

    const panoHeight =
        progressivePanorama.height;


    /*
        Chaque photo correspond à 30°.

        360° / 12 = 30°
    */

    const sectorWidth =
        panoWidth / TOTAL_PHOTOS;


    /*
        On crée un chevauchement.

        Une photo couvre volontairement
        plus que son secteur.

        Les bords sont fondus.
    */

    const overlap =
        sectorWidth * 0.35;


    const destinationWidth =
        sectorWidth + overlap;


    /*
        Position de la photo.

        Photo 0 -> 0
        Photo 1 -> sectorWidth
        Photo 2 -> 2 * sectorWidth
        etc.
    */

    const x =
        photoIndex * sectorWidth - overlap / 2;


    /*
        On utilise la partie centrale
        de la photo.

        Cela évite de répéter énormément
        les côtés de chaque prise.
    */

    const sourceX =
        image.width * SOURCE_START;

    const sourceWidth =
        image.width *
        (SOURCE_END - SOURCE_START);


    /*
        Rapport d'image.
    */

    const ratio =
        sourceWidth / image.height;


    let drawWidth =
        destinationWidth;

    let drawHeight =
        drawWidth / ratio;


    /*
        On remplit verticalement
        sans déformer.
    */

    if (drawHeight < panoHeight) {

        drawHeight =
            panoHeight;

        drawWidth =
            drawHeight * ratio;

    }


    const drawY =
        (panoHeight - drawHeight) / 2;


    /*
        Canvas temporaire pour appliquer
        un masque de fondu horizontal.
    */

    const temp =
        document.createElement("canvas");

    temp.width =
        Math.ceil(destinationWidth);

    temp.height =
        panoHeight;


    const tempCtx =
        temp.getContext("2d");


    tempCtx.drawImage(
        image,

        sourceX,
        0,
        sourceWidth,
        image.height,

        0,
        drawY,
        destinationWidth,
        drawHeight
    );


    /*
        MASQUE DE FONDU

        Le début et la fin de la photo
        sont progressivement transparents.

        Résultat :

        photo A ████████▓▓▓
                         ▓▓▓████████ photo B

        plutôt que :

        photo A █████████████
        photo B █████████████
    */

    const gradient =
        tempCtx.createLinearGradient(
            0,
            0,
            destinationWidth,
            0
        );


    const fade =
        Math.min(
            0.28,
            overlap / destinationWidth
        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    gradient.addColorStop(
        fade,
        "rgba(0,0,0,1)"
    );

    gradient.addColorStop(
        1 - fade,
        "rgba(0,0,0,1)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    tempCtx.globalCompositeOperation =
        "destination-in";

    tempCtx.fillStyle =
        gradient;

    tempCtx.fillRect(
        0,
        0,
        destinationWidth,
        panoHeight
    );


    /*
        PREMIERE PHOTO :

        Elle doit être opaque,
        sinon elle commencerait transparente.
    */

    if (photoIndex === 0) {

        panoramaContext.globalAlpha = 1;

        panoramaContext.drawImage(
            image,

            sourceX,
            0,
            sourceWidth,
            image.height,

            0,
            drawY,
            sectorWidth,
            drawHeight
        );

    } else {

        panoramaContext.globalAlpha = 1;

        panoramaContext.drawImage(
            temp,
            x,
            0
        );

    }


    /*
        Remise à zéro.
    */

    panoramaContext.globalAlpha =
        1;

    panoramaContext.globalCompositeOperation =
        "source-over";


    /*
        AFFICHAGE IMMEDIAT

        Le canvas est directement transformé
        en image pour l'aperçu.
    */

    updateProgressiveImage();

    panoramaBlack.style.display =
        "none";

}


/* =========================================================
   METTRE A JOUR IMAGE PANORAMIQUE
========================================================= */

function updateProgressiveImage() {

    /*
        On transforme le Canvas en DataURL.

        Cela permet de conserver l'image déjà
        construite sans réafficher toutes les photos
        précédentes.
    */

    const data =
        progressivePanorama.toDataURL(
            "image/jpeg",
            .88
        );


    /*
        Rien n'est répété ici :
        c'est toujours LE MÊME CANVAS.
    */

    /*
        Petite animation visuelle.
    */

    progressivePanorama.style.opacity =
        "0.55";

    requestAnimationFrame(() => {

        progressivePanorama.style.opacity =
            "1";

    });

}


/* =========================================================
   INTERFACE DE CAPTURE
========================================================= */

function updateCaptureInterface() {

    const index =
        currentPhotoIndex;


    const percent =
        Math.round(
            (index / TOTAL_PHOTOS) * 100
        );


    photoCounter.textContent =
        `Photo ${Math.min(index + 1, TOTAL_PHOTOS)} / ${TOTAL_PHOTOS}`;


    photoPercent.textContent =
        `${percent}%`;


    progressFill.style.width =
        `${percent}%`;


    /*
        POSITION

        0 = avant
        1 = avant-droite
        etc.
    */

    const positions = [
        "Avant",
        "Avant-droite",
        "Droite",
        "Arrière-droite",
        "Arrière",
        "Arrière-gauche",
        "Gauche",
        "Avant-gauche",
        "Avant",
        "Avant-droite",
        "Droite",
        "Arrière-droite"
    ];


    capturePosition.textContent =
        `Position : ${positions[index]}`;


    if (index === 0) {

        captureInstruction.textContent =
            "Prends la photo de départ";

        moveTarget(0);

    } else {

        captureInstruction.textContent =
            "Tourne doucement de 30° vers la droite";

        moveTarget(index);

    }


    /*
        Progression :

        photo 1 terminée = 8.33%
        photo 2 terminée = 16.67%
        ...
        photo 12 terminée = 100%
    */

    const completedPercent =
        Math.round(
            (index / TOTAL_PHOTOS) * 100
        );

    progressFill.style.width =
        `${completedPercent}%`;

}


/* =========================================================
   POSITION CIBLE
========================================================= */

function moveTarget(index) {

    /*
        Position circulaire.

        Le point orange se déplace
        autour du centre.
    */

    const angle =
        (index * STEP_ANGLE - 90) *
        Math.PI /
        180;


    const radius =
        62;


    const x =
        50 +
        Math.cos(angle) *
        (radius / 1.65);


    const y =
        50 +
        Math.sin(angle) *
        (radius / 1.65);


    targetPoint.style.left =
        `${x}%`;

    targetPoint.style.top =
        `${y}%`;
}


function animateTarget() {

    targetPoint.animate(
        [
            {
                transform:
                    "translate(-50%, -50%) scale(.8)",
                opacity: .5
            },

            {
                transform:
                    "translate(-50%, -50%) scale(1.15)",
                opacity: 1
            },

            {
                transform:
                    "translate(-50%, -50%) scale(1)",
                opacity: 1
            }
        ],
        {
            duration: 450,
            easing: "ease-out"
        }
    );

}


/* =========================================================
   FIN DU PANORAMA
========================================================= */

async function finishPanorama() {

    processing.classList.add("active");

    stopCamera();


    /*
        Petit délai pour laisser le navigateur
        terminer le rendu du canvas.
    */

    await wait(250);


    /*
        FINALISATION DU RACCORD :

        On mélange légèrement les extrémités
        afin que la dernière photo puisse rejoindre
        la première.

        Pour un vrai stitch professionnel,
        il faudrait ensuite une correction de
        perspective/points caractéristiques.
    */

    blendPanoramaEdges();


    await wait(150);


    const finalDataURL =
        progressivePanorama.toDataURL(
            "image/jpeg",
            .90
        );


    /*
        Création de la scène.
    */

    const sceneNumber =
        scenes.length + 1;


    const scene = {

        id:
            Date.now(),

        name:
            `Scène 360° ${sceneNumber}`,

        image:
            finalDataURL,

        createdAt:
            new Date().toISOString()

    };


    scenes.push(scene);

    saveScenes();

    renderScenes();

    currentScene =
        scene;


    showPanorama(
        finalDataURL
    );


    processing.classList.remove("active");

    captureOverlay.classList.remove("active");

    currentPhotoIndex = 0;

    capturedPhotos = [];

    clearProgressivePanorama();

}


/* =========================================================
   RACCORD PREMIERE / DERNIERE PHOTO
========================================================= */

function blendPanoramaEdges() {

    const width =
        progressivePanorama.width;

    const height =
        progressivePanorama.height;


    const edgeWidth =
        Math.floor(
            width * 0.035
        );


    if (edgeWidth <= 0) {
        return;
    }


    /*
        Pour éviter une ligne brutale au raccord
        360° / 0°.
    */

    const left =
        panoramaContext.getImageData(
            0,
            0,
            edgeWidth,
            height
        );


    const right =
        panoramaContext.getImageData(
            width - edgeWidth,
            0,
            edgeWidth,
            height
        );


    const mixed =
        panoramaContext.createImageData(
            edgeWidth,
            height
        );


    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < edgeWidth;
            x++
        ) {

            const leftIndex =
                (y * edgeWidth + x) * 4;

            const rightIndex =
                (y * edgeWidth + x) * 4;


            const t =
                x / Math.max(
                    1,
                    edgeWidth - 1
                );


            mixed.data[leftIndex] =
                Math.round(
                    left.data[leftIndex] *
                    (1 - t) +
                    right.data[rightIndex] *
                    t
                );

            mixed.data[leftIndex + 1] =
                Math.round(
                    left.data[leftIndex + 1] *
                    (1 - t) +
                    right.data[rightIndex + 1] *
                    t
                );

            mixed.data[leftIndex + 2] =
                Math.round(
                    left.data[leftIndex + 2] *
                    (1 - t) +
                    right.data[rightIndex + 2] *
                    t
                );

            mixed.data[leftIndex + 3] =
                255;

        }

    }


    panoramaContext.putImageData(
        mixed,
        0,
        0
    );

}

   AFFICHER PANORAMA

/* =========================================================
   AFFICHER SCENES
========================================================= */

function renderScenes() {

    sceneList.innerHTML = "";


    if (!scenes.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "scene-empty";

        empty.textContent =
            "Aucune scène pour le moment. Crée ton premier panorama.";

        sceneList.appendChild(
            empty
        );

        return;

    }


    scenes.forEach(
        scene => {

            const item =
                document.createElement("div");

            item.className =
                "scene-item";


            const image =
                document.createElement("img");

            image.className =
                "scene-thumb";

            image.src =
                scene.image;

            image.alt =
                scene.name;


            const info =
                document.createElement("div");

            info.className =
                "scene-info";


            const name =
                document.createElement("div");

            name.className =
                "scene-name";

            name.textContent =
                scene.name;


            const buttons =
                document.createElement("div");

            buttons.className =
                "scene-buttons";


            const open =
                document.createElement("button");

            open.textContent =
                "Ouvrir";


            const rename =
                document.createElement("button");

            rename.textContent =
                "Renommer";


            const remove =
                document.createElement("button");

            remove.textContent =
                "Supprimer";


            open.addEventListener(
                "click",
                () => {

                    currentScene =
                        scene;

                    showPanorama(
                        scene.image
                    );

                    sidebar.classList.remove(
                        "open"
                    );

                }
            );


            rename.addEventListener(
                "click",
                () => {

                    const newName =
                        prompt(
                            "Nouveau nom :",
                            scene.name
                        );

                    if (
                        newName &&
                        newName.trim()
                    ) {

                        scene.name =
                            newName.trim();

                        saveScenes();

                        renderScenes();

                    }

                }
            );


            remove.addEventListener(
                "click",
                () => {

                    if (
                        !confirm(
                            `Supprimer "${scene.name}" ?`
                        )
                    ) {

                        return;

                    }


                    scenes =
                        scenes.filter(
                            s =>
                                s.id !== scene.id
                        );


                    saveScenes();

                    renderScenes();


                    if (
                        currentScene &&
                        currentScene.id === scene.id
                    ) {

                        currentScene =
                            null;

                        panoramaImage.style.display =
                            "none";

                        emptyPanorama.style.display =
                            "flex";

                    }

                }
            );


            buttons.appendChild(open);
            buttons.appendChild(rename);
            buttons.appendChild(remove);

            info.appendChild(name);
            info.appendChild(buttons);

            item.appendChild(image);
            item.appendChild(info);

            sceneList.appendChild(item);

        }
    );

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function goFullscreen() {

    const element =
        document.documentElement;


    try {

        if (!document.fullscreenElement) {

            await element.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.warn(
            "Fullscreen indisponible.",
            error
        );

    }

}


fullscreenButton.addEventListener(
    "click",
    goFullscreen
);


fullscreenViewer.addEventListener(
    "click",
    goFullscreen
);

/* =========================================================
   OUTILS
========================================================= */

function blobToDataURL(blob) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                blob
            );

        }
    );

}


function blobToImage(blob) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(blob);

            const image =
                new Image();


            image.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(image);

                };


            image.onerror =
                error => {

                    URL.revokeObjectURL(
                        url
                    );

                    reject(error);

                };


            image.src =
                url;

        }
    );

}


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
